# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: "Argos · Conocimiento"
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: es-ES
  baseUrl: localhost:8400
  ignorePatterns: [private, templates]
  theme:
    fontOrigin: local
    cdnCaching: false
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#fafafa"
        lightgray: "#e5e7eb"
        gray: "#94a3b8"
        darkgray: "#334155"
        dark: "#0f172a"
        secondary: "#2563eb"
        tertiary: "#7c3aed"
        highlight: rgba(59, 130, 246, 0.12)
        textHighlight: "#fde68a88"
      darkMode:
        light: "#111827"
        lightgray: "#374151"
        gray: "#64748b"
        darkgray: "#d1d5db"
        dark: "#f8fafc"
        secondary: "#60a5fa"
        tertiary: "#a78bfa"
        highlight: rgba(96, 165, 250, 0.16)
        textHighlight: "#92400e88"
plugins:
  - source: "github:quartz-community/note-properties"
    enabled: true
    order: 5
    options:
      includeAll: false
      includedProperties: [knowledge_id, type, description, tags, aliases, entity_kind, entity_value, strength, warning_id, status, captured_at, code, url, source_kind]
      excludedProperties: []
      hidePropertiesView: false
  - source: "github:quartz-community/created-modified-date"
    enabled: true
    order: 10
  - source: "github:quartz-community/obsidian-flavored-markdown"
    enabled: true
    options: { enableInHtmlEmbed: false, enableCheckbox: true }
    order: 30
  - source: "github:quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "github:quartz-community/crawl-links"
    enabled: true
    options: { markdownLinkResolution: shortest }
    order: 60
  - source: "github:quartz-community/description"
    enabled: true
    order: 70
  - source: "github:quartz-community/alias-redirects"
    enabled: true
  - source: "github:quartz-community/og-image"
    enabled: true
  - source: "github:quartz-community/content-page"
    enabled: true
  - source: "github:quartz-community/folder-page"
    enabled: true
  - source: "github:quartz-community/tag-page"
    enabled: true
  - source: "github:quartz-community/search"
    enabled: true
    layout: { position: left, priority: 20 }
  - source: "./quartz-okf"
    enabled: true
  - source: "./quartz-okf-explorer"
    enabled: true
    layout: { position: right, priority: 15 }
  - source: "github:quartz-community/article-title"
    enabled: true
    layout: { position: beforeBody, priority: 10 }
  - source: "github:quartz-community/page-title"
    enabled: true
    layout: { position: left, priority: 10 }
layout:
  byPageType:
    "404": { positions: { beforeBody: [], left: [], right: [] } }
    content: {}
    folder: {}
    tag: {}
