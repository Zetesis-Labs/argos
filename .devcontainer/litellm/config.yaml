model_list:
  # Modelo sintético: no llama a ningún proveedor y no necesita API key.
  # Lleva pricing declarado para que el coste sea visible end-to-end sin gastar.
  - model_name: mock
    litellm_params:
      model: openai/mock
      api_key: not-needed
      mock_response: "Respuesta del modelo mock: el gateway funciona."
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015

  - model_name: gpt-5.6-terra
    litellm_params:
      model: openai/gpt-5.6-terra
      api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  drop_params: true
  num_retries: 2
  default_key_generate_params:
    max_budget: 5.0

# Sin callback a Langfuse a propósito: contra Langfuse v4 el callback llega sin
# coste ni sesión. La traza la emite el runtime por OpenTelemetry (constitución §11).

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
