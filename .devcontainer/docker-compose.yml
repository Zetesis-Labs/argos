name: argos

services:
  knowledge:
    build:
      context: .
      dockerfile: knowledge.Dockerfile
    restart: unless-stopped
    profiles: ["docs"]
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - knowledge_cache:/cache
    environment:
      XDG_CACHE_HOME: /cache
    ports:
      - "127.0.0.1:${KNOWLEDGE_PORT:-8400}:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:8080/static/okf-graph.json').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
      - app_venv:/workspace/.venv
      - claude_memory:/root/.claude
    env_file:
      - path: .env
        required: false
    environment:
      SURREAL_URL: http://surrealdb:8000
      SURREAL_ROOT_USER: root
      SURREAL_ROOT_PASSWORD: ${SURREAL_ROOT_PASSWORD:-root}
      SURREAL_AGENT_PASSWORD: ${SURREAL_AGENT_PASSWORD:-agent-dev-password}
      SURREAL_RUNTIME_PASSWORD: ${SURREAL_RUNTIME_PASSWORD:-runtime-dev-password}
      SURREAL_GATEWAY_PASSWORD: ${SURREAL_GATEWAY_PASSWORD:-gateway-dev-password}
      KNOWLEDGE_GRAPH_PATH: knowledge/dist/okf-graph.json
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-argos-master-key}
      OPENAI_API_KEY: ""
    depends_on:
      surrealdb:
        condition: service_healthy
      litellm:
        condition: service_healthy

  bootstrap:
    extends:
      service: app
    profiles: ["services"]
    command: ["uv", "run", "--frozen", "bootstrap-local"]
    restart: "no"

  gateway:
    extends:
      service: app
    profiles: ["services"]
    command: ["uv", "run", "--frozen", "gateway"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-7777}:7777"
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  surrealdb:
    image: surrealdb/surrealdb:v3.2
    restart: unless-stopped
    user: root
    command:
      - start
      - --user
      - root
      - --pass
      - ${SURREAL_ROOT_PASSWORD:-root}
      - --bind
      - 0.0.0.0:8000
      - --log
      - info
      - rocksdb:/data/argos.db
    environment:
      # El MCP embebido rechaza con 403 cualquier Host que no sea loopback y no
      # esté en esta lista; el hostname del compose es `surrealdb`.
      SURREAL_MCP_ALLOWED_HOSTS: surrealdb:8000,localhost:${SURREAL_PORT:-8100}
    ports:
      - "127.0.0.1:${SURREAL_PORT:-8100}:8000"
    volumes:
      - surreal_data:/data
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 3s
      timeout: 3s
      retries: 20

  surrealdb-test:
    image: surrealdb/surrealdb:v3.2
    restart: unless-stopped
    user: root
    command:
      - start
      - --user
      - root
      - --pass
      - ${SURREAL_ROOT_PASSWORD:-root}
      - --bind
      - 0.0.0.0:8000
      - --log
      - warn
      - rocksdb:/data/argos-test.db
    environment:
      SURREAL_MCP_ALLOWED_HOSTS: surrealdb-test:8000
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 3s
      timeout: 3s
      retries: 20

  surrealist:
    image: surrealdb/surrealist:latest
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "127.0.0.1:${SURREALIST_PORT:-8200}:8080"
    depends_on:
      surrealdb:
        condition: service_healthy

  litellm:
    image: ghcr.io/berriai/litellm:v1.99.1
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4100}:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-argos-master-key}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:4000/health/liveliness")
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  knowledge_cache:
  app_venv:
  claude_memory:
  surreal_data:
